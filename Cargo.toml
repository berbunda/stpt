[package]
name = "stpt"
version = "0.1.6-0"
edition = "2024"
rust-version = "1.99"

[dependencies]
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
socket2 = "0.6"
tokio = { version = "1.53", features = ["rt-multi-thread", "time"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["macros"] }
